<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f4">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data:; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
  <title>약봄</title>
  <link rel="stylesheet" href="/static/styles.css?v=20260817ux5">
  <link rel="stylesheet" href="/static/prescription.css?v=20260817ux2">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">MEDICINE</p>
        <h1 id="page-title">오늘의 복약</h1>
      </div>
      <button class="profile-switcher" id="profile-shortcut" type="button" aria-label="프로필 선택">
        <span class="profile-switcher-avatar" id="profile-shortcut-avatar" aria-hidden="true">+</span>
        <span class="profile-switcher-copy"><small>프로필</small><strong id="profile-shortcut-name">선택</strong></span>
        <span class="profile-switcher-chevron" aria-hidden="true">⌄</span>
      </button>
    </header>

    <main id="app-main" class="main-content">
      <section class="screen active" data-screen="home">
        <div id="home-content"></div>
      </section>

      <section class="screen" data-screen="meds">
        <div class="section-heading">
          <div><p class="eyebrow">MY MEDS</p><h2>복용 중인 약</h2></div>
          <button class="text-button" data-go="search" type="button">약 추가</button>
        </div>
        <div id="medications-list" class="stack"></div>
        <div class="section-heading history-heading">
          <div><p class="eyebrow">HISTORY</p><h2>최근 복용 기록</h2></div>
        </div>
        <div id="dose-history" class="stack compact"></div>
      </section>

      <section class="screen" data-screen="search">
        <div class="hero-card search-hero">
          <div class="search-intro">
            <p class="eyebrow">ADD MEDICINE</p>
            <h2>약을 검색하세요</h2>
            <p class="muted">식약처 허가 의약품에서 검색하고, 현재 복용약과 프로필을 함께 확인해 DUR 위험 범위를 알려줘요.</p>
          </div>
          <label class="search-box">
            <span aria-hidden="true">⌕</span>
            <input id="drug-query" type="search" placeholder="제품명, 성분명, 제품코드" autocomplete="off">
          </label>
          <div class="ocr-import-card">
            <label class="secondary-button wide ocr-file-button" for="ocr-image-input">처방전 사진으로 불러오기</label>
            <input id="ocr-image-input" class="visually-hidden" type="file" accept="image/*" capture="environment">
            <p class="muted small">사진은 서버로 전송되지 않고 이 기기에서만 인식해요. 인식 결과는 저장 전에 직접 수정하고 제품을 확인할 수 있어요.</p>
            <div id="ocr-status" class="muted small" role="status"></div>
          </div>
        </div>
        <section id="ocr-review-panel" class="hidden">
          <div class="section-heading"><div><p class="eyebrow">PHOTO REVIEW</p><h2>인식 결과 확인</h2></div></div>
          <div id="ocr-review-list" class="stack"></div>
        </section>
        <div id="search-status" class="muted small search-status"></div>
        <div id="drug-results" class="stack"></div>
      </section>

      <section class="screen people-screen" data-screen="people">
        <div class="section-heading">
          <div><p class="eyebrow">PEOPLE</p><h2>함께 관리하기</h2></div>
        </div>
        <div id="people-list" class="stack"></div>
        <button id="open-person-form" class="primary-button wide" type="button">+ 프로필 추가</button>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="주 메뉴">
      <button class="nav-item active" data-nav="home" type="button" aria-current="page"><span aria-hidden="true">⌂</span><small>홈</small></button>
      <button class="nav-item" data-nav="meds" type="button"><span aria-hidden="true">◉</span><small>복용</small></button>
      <button class="nav-item" data-nav="search" type="button"><span aria-hidden="true">＋</span><small>약 검색</small></button>
      <button class="nav-item" data-nav="people" type="button"><span aria-hidden="true">♙</span><small>프로필</small></button>
    </nav>
  </div>

  <div id="sheet-backdrop" class="sheet-backdrop hidden"></div>
  <section id="risk-sheet" class="bottom-sheet hidden" role="dialog" aria-modal="true" aria-labelledby="risk-title">
    <div class="sheet-handle"></div>
    <div id="risk-sheet-content"></div>
  </section>

  <section id="person-sheet" class="bottom-sheet hidden" role="dialog" aria-modal="true" aria-labelledby="person-form-title">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div><p class="eyebrow">NEW PROFILE</p><h2 id="person-form-title">프로필 추가</h2></div>
      <button class="icon-button" data-close-sheet type="button" aria-label="닫기">×</button>
    </div>
    <form id="person-form" class="form-stack">
      <input name="notes" type="hidden">
      <label>이름<input name="name" required placeholder="예: 나, 엄마"></label>
      <label>생년월일<input name="birth_date" type="date" min="1000-01-01" required></label>
      <label>성별
        <select name="sex" required>
          <option value="" selected disabled>선택하세요</option>
          <option value="female">여성</option>
          <option value="male">남성</option>
        </select>
      </label>
      <label data-reproductive-field>임신 여부
        <select name="pregnancy_status" required>
          <option value="" selected disabled>선택하세요</option>
          <option value="pregnant">임신 중</option>
          <option value="not_pregnant">임신 중 아님</option>
        </select>
      </label>
      <label data-reproductive-field>수유 여부
        <select name="lactation_status" required>
          <option value="" selected disabled>선택하세요</option>
          <option value="breastfeeding">수유 중</option>
          <option value="not_breastfeeding">수유 중 아님</option>
        </select>
      </label>
      <button id="person-submit" class="primary-button wide" type="submit">프로필 저장</button>
    </form>
  </section>

  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/static/native-api.js?v=20260817err1" defer></script>
  <script src="/static/dialog.js?v=20260815a" defer></script>
  <script src="/static/prescription.js?v=20260817err1" defer></script>
  <script src="/static/people.js?v=20260817ux4" defer></script>
  <script src="/static/timeline.js?v=20260811b" defer></script>
  <script src="/static/app.js?v=20260817err1" defer></script>
  <script src="/static/ocr-review.js?v=20260817ux2" defer></script>
</body>
</html>
