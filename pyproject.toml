[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medicine"
version = "0.1.0"
description = "Mobile-first local medication manager backed by Korean DUR data"
requires-python = ">=3.13"
dependencies = [
  "cryptography==50.0.0",
]

[project.scripts]
medicine-app = "medicine_app.cli:main"
medicine-canonical = "medicine_canonical.cli:main"

[tool.setuptools.packages.find]
include = ["medicine_app*", "medicine_canonical*", "medicine_reference*"]

[tool.setuptools.package-data]
medicine_app = ["static/*.html", "static/*.css", "static/*.js"]
medicine_canonical = ["data/*.tsv"]
medicine_reference = ["data/*.tsv"]
