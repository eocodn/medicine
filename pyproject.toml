[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medicine-dur"
version = "0.1.0"
description = "Mobile-first local medication manager backed by Korean DUR data"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "uvicorn==0.35.0",
]

[project.scripts]
medicine-dur = "medicine_dur.cli:main"
medicine-app = "medicine_app.cli:main"
medicine-catalog = "medicine_catalog.cli:main"
medicine-canonical = "medicine_canonical.cli:main"

[tool.setuptools.packages.find]
include = ["medicine_dur*", "medicine_app*", "medicine_catalog*", "medicine_canonical*"]

[tool.setuptools.package-data]
medicine_app = ["static/*.html", "static/*.css", "static/*.js"]
