services:
  dur:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    entrypoint: ["python", "-m", "medicine_dur.cli"]

  catalog:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
    entrypoint: ["python", "-m", "medicine_catalog.cli"]

  app:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    entrypoint: ["python", "-m", "medicine_app.cli"]

  web:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:${MEDICINE_PORT:-18787}:8000"
    command: ["uvicorn", "medicine_app.web:app", "--host", "0.0.0.0", "--port", "8000"]

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    working_dir: /app
    volumes:
      - .:/app

  test:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    entrypoint: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]

  android:
    build:
      context: .
      dockerfile: Dockerfile.android
    working_dir: /workspace/android
    volumes:
      - .:/workspace
      - android-gradle-cache:/opt/gradle-cache
    environment:
      MEDICINE_WEB_URL: ${MEDICINE_WEB_URL:-http://10.0.2.2:18787/}
    command: ["gradle", "--no-daemon", "testDebugUnitTest", "assembleDebug", "-PmedicineWebUrl=${MEDICINE_WEB_URL:-http://10.0.2.2:18787/}"]

volumes:
  android-gradle-cache:
