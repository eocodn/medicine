services:
  canonical:
    build: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
    entrypoint: ["python", "-m", "medicine_canonical.cli"]

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
    working_dir: /app
    volumes:
      - .:/app
    entrypoint: ["python", "-m", "medicine_app.cli"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
      MEDICINE_CANONICAL_DB: ${MEDICINE_CANONICAL_DB:-}
      MEDICINE_REFERENCE_DIR: ${MEDICINE_REFERENCE_DIR:-data/reference}
      MEDICINE_REFERENCE_UPDATE_BASE_URL: ${MEDICINE_REFERENCE_UPDATE_BASE_URL:-https://pub-539f06de795a469c85ab40570a8634a2.r2.dev/}
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "${MEDICINE_BIND_IP:-127.0.0.1}:${MEDICINE_PORT:-18787}:8000"

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
    working_dir: /app
    volumes:
      - .:/app

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    working_dir: /app
    volumes:
      - .:/app
    entrypoint: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]

  browser-test:
    image: node:22-slim@sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: ["sh", "-lc", "node --test browser_ocr/test/*.test.js"]

  ocr-detection-test:
    build:
      context: .
      dockerfile: browser_ocr/detection/Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: ["sh", "-lc", "node --test browser_ocr/detection/tests/*.test.mjs && /opt/detection-venv/bin/python -m unittest discover -s browser_ocr/detection/tests -p 'test_*.py' -v && node browser_ocr/detection/cli.mjs validate --corpus browser_ocr/detection/corpus/manifest.json --json && node browser_ocr/detection/cli.mjs audit --corpus browser_ocr/detection/corpus/manifest.json --json"]

  ocr-detection-benchmark:
    build:
      context: .
      dockerfile: browser_ocr/detection/Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
      - type: bind
        source: ${MEDICINE_ARTIFACTS_DIR:-${HOME}/dev/.artifacts/medicine}
        target: /artifacts
        bind:
          create_host_path: false
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: ["node", "browser_ocr/detection/cli.mjs", "benchmark", "--json"]

  ocr-detector-train:
    build:
      context: .
      dockerfile: browser_ocr/finetune/Dockerfile.train
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    environment:
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      CUDA_VISIBLE_DEVICES: "${OCR_FINETUNE_GPU:-0}"
    volumes:
      - .:/workspace
      - type: bind
        source: ${MEDICINE_ARTIFACTS_DIR:-${HOME}/dev/.artifacts/medicine}
        target: /artifacts
        bind:
          create_host_path: false
    gpus: all
    shm_size: "4gb"
    entrypoint: ["python", "-m", "browser_ocr.detection.training_cli"]

  ocr-detector-export-paddle:
    build:
      context: .
      dockerfile: browser_ocr/finetune/Dockerfile.train
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    environment:
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      CUDA_VISIBLE_DEVICES: ""
    volumes:
      - .:/workspace:ro
      - type: bind
        source: ${MEDICINE_ARTIFACTS_DIR:-${HOME}/dev/.artifacts/medicine}
        target: /artifacts
        bind:
          create_host_path: false
    gpus: all
    entrypoint: ["python", "-m", "browser_ocr.detection.export_cli"]

  ocr-detector-convert:
    build:
      context: .
      dockerfile: browser_ocr/detection/Dockerfile.converter
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    environment:
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - .:/workspace:ro
      - type: bind
        source: ${MEDICINE_ARTIFACTS_DIR:-${HOME}/dev/.artifacts/medicine}
        target: /artifacts
        bind:
          create_host_path: false
    entrypoint: ["python", "-m", "browser_ocr.detection.candidate_cli"]

  ocr-detector-candidate-eval:
    build:
      context: .
      dockerfile: browser_ocr/detection/Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    environment:
      HOME: /tmp
    volumes:
      - .:/workspace:ro
      - type: bind
        source: ${MEDICINE_ARTIFACTS_DIR:-${HOME}/dev/.artifacts/medicine}
        target: /artifacts
        bind:
          create_host_path: false
    entrypoint: ["node", "browser_ocr/detection/candidate_evaluation.mjs"]

  ocr-corpus:
    build:
      context: .
      dockerfile: browser_ocr/detection/Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
      - type: bind
        source: ${MEDICINE_ARTIFACTS_DIR:-${HOME}/dev/.artifacts/medicine}
        target: /artifacts
        bind:
          create_host_path: false
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    entrypoint: ["node", "browser_ocr/corpus/cli.mjs"]

  ocr-eval:
    build:
      context: .
      dockerfile: browser_ocr/Dockerfile
      target: eval

  ocr-document-parse:
    image: python:3.13-slim@sha256:9662417aace5ae7b8e2609cce472b72a8958e134ba372808abe9cc1a0c0125e6
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
