services:
  canonical:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
    entrypoint: ["python", "-m", "medicine_canonical.cli"]

  app:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    entrypoint: ["python", "-m", "medicine_app.cli"]

  web:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "${MEDICINE_BIND_IP:-127.0.0.1}:${MEDICINE_PORT:-18787}:8000"
    command: ["uvicorn", "medicine_app.web:app", "--host", "0.0.0.0", "--port", "8000"]

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    working_dir: /app
    volumes:
      - .:/app

  test:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    entrypoint: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]

  browser-test:
    image: node:22-slim@sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: ["sh", "-lc", "node --test browser_ocr/test/*.test.js"]

  ocr-detection-test:
    image: node:22-slim@sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: ["sh", "-lc", "node --test browser_ocr/detection/tests/*.test.mjs && node browser_ocr/detection/cli.mjs validate --corpus browser_ocr/detection/corpus/manifest.json --json && node browser_ocr/detection/cli.mjs audit --corpus browser_ocr/detection/corpus/manifest.json --json"]

  ocr-eval:
    build:
      context: .
      dockerfile: browser_ocr/Dockerfile
      target: eval

  android:
    build:
      context: .
      dockerfile: Dockerfile.android
    working_dir: /workspace/android
    volumes:
      - .:/workspace
      - android-gradle-cache:/opt/gradle-cache
    command:
      - sh
      - -lc
      - >-
        cd /workspace &&
        PYTHONPATH=/workspace python3.12 -c
        'import json; from medicine_canonical.mobile import build_mobile_database; print(json.dumps(build_mobile_database("data/db/canonical.sqlite", "data/db/mobile.sqlite"), ensure_ascii=False))'
        && cd /workspace/android
        && gradle --no-daemon testDebugUnitTest assembleDebug

volumes:
  android-gradle-cache:
