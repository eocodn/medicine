services:
  dev:
    image: medicine/dev:local
    build:
      context: .
      dockerfile: Dockerfile.dev
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace
      - type: bind
        source: ${MEDICINE_DEV_HOME:-${HOME}/dev/.artifacts/medicine/dev-home/${COMPOSE_PROJECT_NAME}}
        target: /home/build-farm
        bind:
          create_host_path: false
    command: ["sh", "/workspace/scripts/check.sh", "core"]

  web:
    image: medicine/dev:local
    build:
      context: .
      dockerfile: Dockerfile.dev
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    environment:
      MEDICINE_CANONICAL_DB: ${MEDICINE_CANONICAL_DB:-}
      MEDICINE_REFERENCE_DIR: ${MEDICINE_REFERENCE_DIR:-data/reference}
      MEDICINE_REFERENCE_UPDATE_BASE_URL: ${MEDICINE_REFERENCE_UPDATE_BASE_URL:-https://pub-539f06de795a469c85ab40570a8634a2.r2.dev/}
    volumes:
      - .:/workspace
      - type: bind
        source: ${MEDICINE_DEV_HOME:-${HOME}/dev/.artifacts/medicine/dev-home/${COMPOSE_PROJECT_NAME}}
        target: /home/build-farm
        bind:
          create_host_path: false
    ports:
      - "${MEDICINE_BIND_IP:-127.0.0.1}:${MEDICINE_PORT:-18787}:8000"
    command: ["sh", "/workspace/scripts/run_web_dev.sh"]
