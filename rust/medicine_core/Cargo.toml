[package]
name = "medicine_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "medicine-core"
path = "src/bin/medicine_core.rs"

[dependencies]
chrono = "0.4"
jni = "0.21"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.18", features = ["v4"] }
