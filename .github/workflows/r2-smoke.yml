name: R2 smoke

on:
  workflow_dispatch:

permissions: {}

jobs:
  private-bucket-write:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      - name: Install R2 tooling
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir . 'boto3>=1.34,<2'

      - name: Put, verify, and delete smoke object
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os

          import boto3
          from botocore.exceptions import ClientError


          bucket = os.environ["R2_BUCKET"]
          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          key = f"medicine-r2-smoke/{run_id}-{run_attempt}.json"
          body = json.dumps(
              {"github_run_id": run_id, "github_run_attempt": run_attempt},
              separators=(",", ":"),
          ).encode("utf-8")
          digest = hashlib.sha256(body).hexdigest()

          client = boto3.client(
              "s3",
              endpoint_url=os.environ["R2_ENDPOINT"],
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
          )

          uploaded = False
          try:
              client.put_object(
                  Bucket=bucket,
                  Key=key,
                  Body=body,
                  ContentType="application/json",
                  Metadata={"sha256": digest, "github-run-id": run_id},
              )
              uploaded = True

              head = client.head_object(Bucket=bucket, Key=key)
              if head["ContentLength"] != len(body):
                  raise RuntimeError("R2 smoke object size does not match uploaded body")
              if head.get("Metadata", {}).get("sha256") != digest:
                  raise RuntimeError("R2 smoke object metadata hash does not match")
              if head.get("Metadata", {}).get("github-run-id") != run_id:
                  raise RuntimeError("R2 smoke object run metadata does not match")
          finally:
              if uploaded:
                  client.delete_object(Bucket=bucket, Key=key)

          try:
              client.head_object(Bucket=bucket, Key=key)
          except ClientError as exc:
              status = exc.response.get("ResponseMetadata", {}).get("HTTPStatusCode")
              code = exc.response.get("Error", {}).get("Code")
              if status != 404 and code not in {"404", "NoSuchKey", "NotFound"}:
                  raise
          else:
              raise RuntimeError("R2 smoke object still exists after delete")

          print(f"R2 private bucket smoke succeeded for {bucket}")
          PY

      - name: Audit bucket namespace for development public access
        run: medicine-canonical r2-public-audit --json