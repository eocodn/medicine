name: Reference DB publish

on:
  workflow_dispatch:
    inputs:
      refresh_sources:
        description: Fetch fresh MFDS/FDA source snapshots instead of reusing the latest cached snapshot
        required: false
        default: false
        type: boolean
      retire_previous_contract:
        description: Explicitly retire N-1 from the signed Reference Contract support window
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 3 * * *'
      timezone: "Asia/Seoul"
    - cron: '32 3 * * *'
      timezone: "Asia/Seoul"
    - cron: '52 3 * * *'
      timezone: "Asia/Seoul"
    - cron: '22 4 * * *'
      timezone: "Asia/Seoul"
    - cron: '22 5 * * *'
      timezone: "Asia/Seoul"

permissions:
  contents: read

concurrency:
  group: reference-db-publisher
  cancel-in-progress: false

jobs:
  gate:
    if: ${{ github.event_name != 'schedule' || vars.REFERENCE_PUBLISH_SCHEDULE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      day: ${{ steps.day.outputs.day }}
    steps:
      - name: Resolve Seoul publication day
        id: day
        shell: bash
        run: |
          set -euo pipefail
          echo "day=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"

      - name: Check whether today's scheduled publish already succeeded
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DAY: ${{ steps.day.outputs.day }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          runs="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow reference-publish.yml \
              --event schedule \
              --limit 10 \
              --json databaseId,createdAt
          )"
          while IFS=$'\t' read -r run_id created_at; do
            [[ -n "$run_id" && "$run_id" != "$GITHUB_RUN_ID" ]] || continue
            run_day="$(TZ=Asia/Seoul date -d "$created_at" +%F)"
            [[ "$run_day" == "$DAY" ]] || continue
            if gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
              --jq '.jobs[] | select(.name == "publish" and .conclusion == "success") | .id' \
              | grep -q .; then
              echo "Scheduled Reference DB publish already succeeded for ${DAY}; skipping retry slot."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(jq -r '.[] | [.databaseId, .createdAt] | @tsv' <<<"$runs")

          echo "should_run=true" >> "$GITHUB_OUTPUT"

  sources:
    needs: gate
    if: ${{ needs.gate.result == 'success' && needs.gate.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
    outputs:
      cache_key: ${{ steps.source-state.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Validate source prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DATA_GO_KR_SERVICE_KEY:-}" ]]; then
            echo "::error::DATA_GO_KR_SERVICE_KEY is not configured"
            exit 1
          fi

      - name: Install source tooling
        run: python -m pip install --disable-pip-version-check --no-cache-dir .

      - name: Restore today's completed scheduled source snapshot
        id: scheduled-source-cache-restore
        if: ${{ github.event_name == 'schedule' }}
        uses: actions/cache/restore@v5
        with:
          path: |
            data/canonical/raw
            data/canonical/mfds_ingredient
            data/canonical/substances
          key: reference-sources-v4-${{ needs.gate.outputs.day }}

      - name: Restore latest completed source snapshot for manual publish
        id: manual-source-cache-restore
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_sources != true }}
        uses: actions/cache/restore@v5
        with:
          path: |
            data/canonical/raw
            data/canonical/mfds_ingredient
            data/canonical/substances
          key: reference-sources-v4-reuse-${{ github.run_id }}
          restore-keys: |
            reference-sources-v4-

      - name: Resolve source snapshot state
        id: source-state
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REFRESH_SOURCES: ${{ inputs.refresh_sources }}
          SCHEDULED_MATCHED_KEY: ${{ steps.scheduled-source-cache-restore.outputs.cache-matched-key }}
          MANUAL_MATCHED_KEY: ${{ steps.manual-source-cache-restore.outputs.cache-matched-key }}
          DAY: ${{ needs.gate.outputs.day }}
        run: |
          set -euo pipefail
          matched_key="${SCHEDULED_MATCHED_KEY:-}"
          if [[ -z "$matched_key" ]]; then
            matched_key="${MANUAL_MATCHED_KEY:-}"
          fi

          if [[ "$EVENT_NAME" == "schedule" && -n "$matched_key" ]]; then
            echo "sync=false" >> "$GITHUB_OUTPUT"
            echo "key=$matched_key" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REFRESH_SOURCES" != "true" && -n "$matched_key" ]]; then
            echo "sync=false" >> "$GITHUB_OUTPUT"
            echo "key=$matched_key" >> "$GITHUB_OUTPUT"
          else
            echo "sync=true" >> "$GITHUB_OUTPUT"
            if [[ "$EVENT_NAME" == "schedule" ]]; then
              echo "key=reference-sources-v4-${DAY}" >> "$GITHUB_OUTPUT"
            else
              echo "key=reference-sources-v4-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Preflight current MFDS permit API
        if: ${{ steps.source-state.outputs.sync == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          medicine-canonical mfds-preflight --timeout-seconds 8 --json

      - name: Sync official substance identity snapshots
        if: ${{ steps.source-state.outputs.sync == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          medicine-canonical substance-sync --json

      - name: Sync current MFDS permit and DUR snapshots
        if: ${{ steps.source-state.outputs.sync == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          medicine-canonical sync --json

      - name: Save refreshed source snapshot
        if: ${{ steps.source-state.outputs.sync == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            data/canonical/raw
            data/canonical/mfds_ingredient
            data/canonical/substances
          key: ${{ steps.source-state.outputs.key }}

  publish:
    needs: sources
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      REFERENCE_SIGNING_KEY_ID: reference-prod-2026-01
      REFERENCE_SIGNING_KMS_KEY_VERSION: projects/medicine-505813/locations/global/keyRings/medicine-release/cryptoKeys/reference-release-signing/cryptoKeyVersions/1
      REFERENCE_SIGNING_TRUSTED_KEYS_FILE: deploy/reference-signing-trusted-keys.json
      REFERENCE_RELEASE_SEQUENCE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: medicine-505813
          workload_identity_provider: projects/173565993547/locations/global/workloadIdentityPools/github-actions/providers/medicine-reference-publisher

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Validate publication prerequisites
        shell: bash
        run: |
          set -euo pipefail
          for name in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET REFERENCE_SIGNING_KEY_ID REFERENCE_SIGNING_KMS_KEY_VERSION REFERENCE_SIGNING_TRUSTED_KEYS_FILE REFERENCE_RELEASE_SEQUENCE; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done
          test -f "$REFERENCE_SIGNING_TRUSTED_KEYS_FILE"

      - name: Install publisher dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir . 'boto3>=1.34,<2' 'google-cloud-kms>=3,<4'

      - name: Audit R2 bucket namespace before public exposure
        shell: bash
        run: |
          set -euo pipefail
          medicine-canonical r2-public-audit --json

      - name: Restore exact source snapshot
        uses: actions/cache/restore@v5
        with:
          path: |
            data/canonical/raw
            data/canonical/mfds_ingredient
            data/canonical/substances
          key: ${{ needs.sources.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Build authoritative reference databases from preserved snapshots
        shell: bash
        run: |
          set -euo pipefail
          medicine-canonical integrated-build --json

      - name: Verify canonical release gates
        shell: bash
        run: |
          set -euo pipefail
          medicine-canonical verify --json
          medicine-canonical substance-verify --json

      - name: Build verified Reference Contract window and publish latest last
        shell: bash
        env:
          RETIRE_PREVIOUS_CONTRACT: ${{ github.event_name == 'workflow_dispatch' && inputs.retire_previous_contract || false }}
        run: |
          set -euo pipefail
          retirement_args=()
          if [[ "${RETIRE_PREVIOUS_CONTRACT:-false}" == "true" ]]; then
            retirement_args+=(--retire-previous-contract)
          fi
          medicine-canonical reference-build-publish-r2 \
            --db data/db/canonical.sqlite \
            --contract-dir data/db/reference-contracts \
            --output-dir artifacts/reference-release \
            --allow-retired-previous-failure \
            "${retirement_args[@]}" \
            --json

  incident:
    if: ${{ always() && github.event_name == 'schedule' && vars.REFERENCE_PUBLISH_SCHEDULE_ENABLED == 'true' && needs.gate.outputs.should_run != 'false' }}
    needs: [gate, sources, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCES_RESULT: ${{ needs.sources.result }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      INCIDENT_TITLE: "[automation] Reference DB scheduled publish failure"
      INCIDENT_MARKER: "<!-- reference-publish-scheduled-incident -->"
    steps:
      - name: Manage scheduled publish incident
        shell: bash
        run: |
          set -euo pipefail

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          incident_number="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search 'in:title "Reference DB scheduled publish failure"' \
              --limit 100 \
              --json number,title,body \
              --jq '[.[] | select(.title == "[automation] Reference DB scheduled publish failure" and ((.body // "") | contains("<!-- reference-publish-scheduled-incident -->")))] | .[0].number // ""'
          )"

          if [[ "$SOURCES_RESULT" == "success" && "$PUBLISH_RESULT" == "success" ]]; then
            if [[ -z "$incident_number" ]]; then
              exit 0
            fi

            recovery_body="$(mktemp)"
            cat >"$recovery_body" <<EOF
          Scheduled reference publication recovered successfully.

          - Run: ${run_url}
          - Commit: ${GITHUB_SHA}
          - sources: ${SOURCES_RESULT}
          - publish: ${PUBLISH_RESULT}
          EOF
            gh issue comment "$incident_number" --repo "$GITHUB_REPOSITORY" --body-file "$recovery_body"
            gh issue close "$incident_number" --repo "$GITHUB_REPOSITORY" --reason completed
            exit 0
          fi

          failure_body="$(mktemp)"
          cat >"$failure_body" <<EOF
          Scheduled reference publication failed or did not complete successfully.

          - Run: ${run_url}
          - Commit: ${GITHUB_SHA}
          - Attempt: ${GITHUB_RUN_ATTEMPT}
          - sources: ${SOURCES_RESULT}
          - publish: ${PUBLISH_RESULT}

          Inspect the linked Actions run for the failing step and traceback. The reference publisher remains fail-closed; the latest pointer is not advanced unless publication completes successfully.
          EOF

          if [[ -n "$incident_number" ]]; then
            gh issue comment "$incident_number" --repo "$GITHUB_REPOSITORY" --body-file "$failure_body"
            exit 0
          fi

          issue_body="$(mktemp)"
          {
            printf '%s\n\n' "$INCIDENT_MARKER"
            cat "$failure_body"
          } >"$issue_body"
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$INCIDENT_TITLE" \
            --body-file "$issue_body" \
            --label bug
