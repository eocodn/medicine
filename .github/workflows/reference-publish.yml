name: Reference DB publish

on:
  workflow_dispatch:
    inputs:
      refresh_sources:
        description: Fetch fresh KIDS/MFDS/FDA source snapshots instead of reusing the latest cached snapshot
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: reference-db-publisher
  cancel-in-progress: false

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
    outputs:
      cache_key: ${{ steps.source-state.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Validate source prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DATA_GO_KR_SERVICE_KEY:-}" ]]; then
            echo "::error::DATA_GO_KR_SERVICE_KEY is not configured"
            exit 1
          fi

      - name: Install source tooling
        run: python -m pip install --disable-pip-version-check --no-cache-dir .

      - name: Restore latest verified source snapshot
        id: source-cache-restore
        if: ${{ inputs.refresh_sources != true }}
        uses: actions/cache/restore@v5
        with:
          path: |
            data/kids
            data/canonical/raw
            data/canonical/substances
          key: reference-sources-v2-reuse-${{ github.run_id }}
          restore-keys: |
            reference-sources-v2-

      - name: Resolve source snapshot state
        id: source-state
        shell: bash
        env:
          REFRESH_SOURCES: ${{ inputs.refresh_sources }}
          MATCHED_KEY: ${{ steps.source-cache-restore.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          if [[ "$REFRESH_SOURCES" == "true" || -z "$MATCHED_KEY" ]]; then
            echo "sync=true" >> "$GITHUB_OUTPUT"
            echo "key=reference-sources-v2-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          else
            echo "sync=false" >> "$GITHUB_OUTPUT"
            echo "key=$MATCHED_KEY" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync current official KIDS XLSX sources
        if: ${{ steps.source-state.outputs.sync == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          medicine-canonical kids-sync --output-dir data/kids --json

      - name: Sync official substance identity snapshots
        if: ${{ steps.source-state.outputs.sync == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          medicine-canonical substance-sync --json

      - name: Sync current MFDS permit and DUR snapshots
        if: ${{ steps.source-state.outputs.sync == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "MFDS sync attempt ${attempt}/3"
            if medicine-canonical sync --json; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 5))
            fi
          done
          exit 1

      - name: Save refreshed source snapshot
        if: ${{ steps.source-state.outputs.sync == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            data/kids
            data/canonical/raw
            data/canonical/substances
          key: ${{ steps.source-state.outputs.key }}

  publish:
    needs: sources
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      REFERENCE_SIGNING_KEY_ID: reference-prod-2026-01
      REFERENCE_SIGNING_KMS_KEY_VERSION: projects/medicine-505813/locations/global/keyRings/medicine-release/cryptoKeys/reference-release-signing/cryptoKeyVersions/1
      REFERENCE_RELEASE_SEQUENCE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: medicine-505813
          workload_identity_provider: projects/173565993547/locations/global/workloadIdentityPools/github-actions/providers/medicine-reference-publisher

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Validate publication prerequisites
        shell: bash
        run: |
          set -euo pipefail
          for name in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET REFERENCE_SIGNING_KEY_ID REFERENCE_SIGNING_KMS_KEY_VERSION REFERENCE_RELEASE_SEQUENCE; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      - name: Install publisher dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir . 'boto3>=1.34,<2' 'google-cloud-kms>=3,<4'

      - name: Restore exact source snapshot
        uses: actions/cache/restore@v5
        with:
          path: |
            data/kids
            data/canonical/raw
            data/canonical/substances
          key: ${{ needs.sources.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Build authoritative reference databases from preserved snapshots
        shell: bash
        run: |
          set -euo pipefail
          medicine-canonical integrated-build --json

      - name: Verify canonical release gates
        shell: bash
        run: |
          set -euo pipefail
          medicine-canonical verify --json
          medicine-canonical substance-verify --json

      - name: Build verified Android mobile snapshot
        shell: bash
        run: |
          set -euo pipefail
          medicine-canonical mobile-build \
            --db data/db/canonical.sqlite \
            --output data/db/mobile.sqlite \
            --manifest data/db/mobile.manifest.json \
            --json

      - name: Publish immutable release and advance latest last
        shell: bash
        run: |
          set -euo pipefail
          medicine-canonical release-publish-r2 \
            --db data/db/mobile.sqlite \
            --mobile-manifest data/db/mobile.manifest.json \
            --output-dir artifacts/reference-release \
            --json
