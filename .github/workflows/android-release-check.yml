name: Android Developer Release Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned:
    name: Build unsigned Android arm64 release
    runs-on: [self-hosted, wsl-ci]
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out selected ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89.0
        with:
          targets: aarch64-linux-android

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install locked shared UI build tools
        working-directory: ui
        run: npm ci --ignore-scripts

      - name: Install reference-root verifier dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'cryptography==50.0.0'

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd android/gradle/wrapper
          sha256sum -c gradle-wrapper.jar.sha256

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${RUNNER_TEMP}/android-sdk"
          archive="${RUNNER_TEMP}/commandlinetools-linux-13114758_latest.zip"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          printf '%s  %s\n' \
            '7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee' \
            "${archive}" | sha256sum -c -
          mkdir -p "${sdk_root}/cmdline-tools"
          unzip -q "${archive}" -d "${sdk_root}/cmdline-tools"
          mv "${sdk_root}/cmdline-tools/cmdline-tools" "${sdk_root}/cmdline-tools/latest"
          sdkmanager="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "${sdk_root}" "${sdk_root}" >> "${GITHUB_ENV}"
          printf '%s\n%s\n' \
            "${sdk_root}/cmdline-tools/latest/bin" \
            "${sdk_root}/platform-tools" >> "${GITHUB_PATH}"
          set +o pipefail
          yes | "${sdkmanager}" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "${license_status}" -eq 0
          "${sdkmanager}" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

      - name: Resolve Android release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="$(./scripts/current-android-release-tag.sh)"
          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"

      - name: Build and verify unsigned Android release candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf unsigned-dist
          mkdir -p unsigned-dist
          ./scripts/check-android-release.sh \
            "${{ steps.version.outputs.tag }}" "${GITHUB_WORKSPACE}/unsigned-dist"

      - name: Preserve unsigned candidate for isolated signing
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: unsigned-dist
          key: android-release-unsigned-${{ github.sha }}-${{ github.run_id }}-arm64-v8a

  sign-and-validate:
    name: Sign Android arm64 release
    needs: build-unsigned
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out signing policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore unsigned candidate
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: unsigned-dist
          key: android-release-unsigned-${{ github.sha }}-${{ github.run_id }}-arm64-v8a
          fail-on-cache-miss: true

      - name: Prepare Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${RUNNER_TEMP}/android-sdk"
          archive="${RUNNER_TEMP}/commandlinetools-linux-13114758_latest.zip"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          printf '%s  %s\n' \
            '7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee' \
            "${archive}" | sha256sum -c -
          mkdir -p "${sdk_root}/cmdline-tools"
          unzip -q "${archive}" -d "${sdk_root}/cmdline-tools"
          mv "${sdk_root}/cmdline-tools/cmdline-tools" "${sdk_root}/cmdline-tools/latest"
          sdkmanager="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "${sdk_root}" "${sdk_root}" >> "${GITHUB_ENV}"
          printf '%s\n%s\n' \
            "${sdk_root}/cmdline-tools/latest/bin" \
            "${sdk_root}/build-tools/36.0.0" >> "${GITHUB_PATH}"
          set +o pipefail
          yes | "${sdkmanager}" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "${license_status}" -eq 0
          "${sdkmanager}" "build-tools;36.0.0"

      - name: Validate unsigned handoff and signing policy
        id: signing-policy
        env:
          RELEASE_TAG: ${{ needs.build-unsigned.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          unsigned="unsigned-dist/medicine-${RELEASE_TAG}-arm64-v8a-unsigned.apk"
          test -f "${unsigned}"
          shopt -s nullglob
          candidates=(unsigned-dist/*.apk)
          (( ${#candidates[@]} == 1 ))
          if apksigner verify "${unsigned}" >/dev/null 2>&1; then
            printf 'unsigned handoff is unexpectedly already signed\n' >&2
            exit 1
          fi
          fingerprint="$(tr -d '[:space:]' < deploy/android-release-signing-certificate.sha256 | tr '[:upper:]' '[:lower:]')"
          if [[ ! "${fingerprint}" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'pinned Android signing fingerprint is invalid\n' >&2
            exit 1
          fi
          printf 'fingerprint=%s\n' "${fingerprint}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: medicine-505813
          workload_identity_provider: projects/173565993547/locations/global/workloadIdentityPools/github-actions/providers/medicine-android-signer

      - name: Read Android signing identity
        id: android-signing
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3
        with:
          secrets: |-
            keystore_b64:medicine-505813/medicine-android-release-keystore-b64
            signing_password:medicine-505813/medicine-android-release-signing-password

      - name: Sign and verify release APK
        env:
          RELEASE_TAG: ${{ needs.build-unsigned.outputs.tag }}
          EXPECTED_CERT_SHA256: ${{ steps.signing-policy.outputs.fingerprint }}
          GCP_CREDENTIALS_FILE: ${{ steps.gcp-auth.outputs.credentials_file_path }}
          MEDICINE_ANDROID_KEYSTORE_B64: ${{ steps.android-signing.outputs.keystore_b64 }}
          MEDICINE_ANDROID_KEYSTORE_PASSWORD: ${{ steps.android-signing.outputs.signing_password }}
          MEDICINE_ANDROID_KEY_PASSWORD: ${{ steps.android-signing.outputs.signing_password }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keystore="${RUNNER_TEMP}/medicine-android-release.p12"
          unsigned="unsigned-dist/medicine-${RELEASE_TAG}-arm64-v8a-unsigned.apk"
          signed="dist/medicine-${RELEASE_TAG}-arm64-v8a.apk"
          cleanup() {
            rm -f "${keystore}" "${GCP_CREDENTIALS_FILE:-}"
          }
          trap cleanup EXIT
          printf '%s' "${MEDICINE_ANDROID_KEYSTORE_B64}" | base64 --decode > "${keystore}"
          rm -rf dist
          mkdir -p dist
          apksigner sign \
            --ks "${keystore}" \
            --ks-type PKCS12 \
            --ks-key-alias medicine-release \
            --ks-pass env:MEDICINE_ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:MEDICINE_ANDROID_KEY_PASSWORD \
            --min-sdk-version 28 \
            --v1-signing-enabled false \
            --v2-signing-enabled false \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "${signed}" \
            "${unsigned}"
          certificate_output="$(apksigner verify --verbose --print-certs "${signed}")"
          printf '%s\n' "${certificate_output}"
          actual_fingerprint="$(printf '%s\n' "${certificate_output}" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n 1 \
            | tr '[:upper:]' '[:lower:]')"
          if [[ "${actual_fingerprint}" != "${EXPECTED_CERT_SHA256}" ]]; then
            printf 'Android release certificate SHA-256 digest does not match pinned identity\n' >&2
            exit 1
          fi
          cleanup
          trap - EXIT

      - name: Preserve validated Android APK for this run
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: dist
          key: android-release-${{ github.sha }}-${{ github.run_id }}-arm64-v8a
