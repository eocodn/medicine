name: Android Developer Release Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-android:
    name: Check debug-signed Android arm64 release
    runs-on: [self-hosted, wsl-ci]
    timeout-minutes: 45
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser_ocr/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: aarch64-linux-android

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install reference-root verifier dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'cryptography==50.0.0'

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd android/gradle/wrapper
          sha256sum -c gradle-wrapper.jar.sha256

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${RUNNER_TEMP}/android-sdk"
          archive="${RUNNER_TEMP}/commandlinetools-linux-13114758_latest.zip"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          printf '%s  %s\n' \
            '7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee' \
            "${archive}" | sha256sum -c -
          mkdir -p "${sdk_root}/cmdline-tools"
          unzip -q "${archive}" -d "${sdk_root}/cmdline-tools"
          mv "${sdk_root}/cmdline-tools/cmdline-tools" "${sdk_root}/cmdline-tools/latest"
          sdkmanager="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "${sdk_root}" "${sdk_root}" >> "${GITHUB_ENV}"
          printf '%s\n%s\n' \
            "${sdk_root}/cmdline-tools/latest/bin" \
            "${sdk_root}/platform-tools" >> "${GITHUB_PATH}"
          set +o pipefail
          yes | "${sdkmanager}" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "${license_status}" -eq 0
          "${sdkmanager}" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

      - name: Prepare OCR runtime assets
        shell: bash
        run: |
          set -euo pipefail
          runtime="${RUNNER_TEMP}/medicine-ocr-assets"
          printf 'MEDICINE_OCR_ASSETS_DIR=%s\n' "${runtime}" >> "${GITHUB_ENV}"
          cd browser_ocr
          npm ci --ignore-scripts --no-audit --no-fund
          downloads="${RUNNER_TEMP}/medicine-ocr-downloads"
          rm -rf "${downloads}" "${runtime}"
          mkdir -p "${downloads}"
          node fetch_assets.mjs "${downloads}" detection
          node mobile/export_runtime.mjs "${downloads}" "${runtime}"

      - name: Resolve Android release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="$(./scripts/current-android-release-tag.sh)"
          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"

      - name: Build and verify debug-signed Android release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          ./scripts/check-android-release.sh \
            "${{ steps.version.outputs.tag }}" "${GITHUB_WORKSPACE}/dist"

      - name: Preserve validated Android APK for this run
        uses: actions/cache/save@v5
        with:
          path: dist
          key: android-release-${{ github.sha }}-${{ github.run_id }}-arm64-v8a
