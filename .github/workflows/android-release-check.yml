name: Android Developer Release Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-android:
    name: Check debug-signed Android arm64 release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser_ocr/package-lock.json

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd android/gradle/wrapper
          sha256sum -c gradle-wrapper.jar.sha256

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare OCR runtime assets
        shell: bash
        run: |
          set -euo pipefail
          runtime="${RUNNER_TEMP}/medicine-ocr-assets"
          printf 'MEDICINE_OCR_ASSETS_DIR=%s\n' "${runtime}" >> "${GITHUB_ENV}"
          cd browser_ocr
          npm ci --ignore-scripts --no-audit --no-fund
          downloads="${RUNNER_TEMP}/medicine-ocr-downloads"
          rm -rf "${downloads}" "${runtime}"
          mkdir -p "${downloads}"
          node fetch_assets.mjs "${downloads}" detection
          node mobile/export_runtime.mjs "${downloads}" "${runtime}"

      - name: Resolve Android release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="$(./scripts/current-android-release-tag.sh)"
          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"

      - name: Build and verify debug-signed Android release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          ./scripts/check-android-release.sh \
            "${{ steps.version.outputs.tag }}" "${GITHUB_WORKSPACE}/dist"

      - name: Preserve validated Android APK for this run
        uses: actions/cache/save@v5
        with:
          path: dist
          key: android-release-${{ github.sha }}-${{ github.run_id }}-arm64-v8a
