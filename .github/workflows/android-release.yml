name: Android Developer Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

jobs:
  prepare-release:
    name: Resolve validated Android Developer Release Check
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.validation.outputs.run_id }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install reference-root verifier dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'cryptography==50.0.0'

      - name: Require published Reference Contract before APK release
        run: ./scripts/verify-android-reference-contract.sh

      - name: Verify tag matches Android release version
        run: ./scripts/verify-android-release-version.sh "${GITHUB_REF_NAME}"

      - name: Resolve successful Android Developer Release Check for this commit
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/android-release-check.yml/runs?head_sha=${GITHUB_SHA}&event=workflow_dispatch&status=success&per_page=1" \
              --jq '.workflow_runs[0].id // empty'
          )"
          if [[ -z "${run_id}" ]]; then
            printf 'no successful Android Developer Release Check found for tag commit %s\n' "${GITHUB_SHA}" >&2
            exit 1
          fi
          printf 'run_id=%s\n' "${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Ensure draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ensure-release-draft.sh "${GITHUB_REF_NAME}"

  publish-android:
    name: Upload validated Android arm64 APK
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Restore validated Android APK
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: dist
          key: android-release-${{ github.sha }}-${{ needs.prepare-release.outputs.run_id }}-arm64-v8a
          fail-on-cache-miss: true

      - name: Verify validated Android APK
        shell: bash
        run: |
          set -euo pipefail
          expected="dist/medicine-${GITHUB_REF_NAME}-arm64-v8a.apk"
          test -f "${expected}"
          shopt -s nullglob
          apks=(dist/*.apk)
          (( ${#apks[@]} == 1 ))

      - name: Upload validated Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "dist/medicine-${GITHUB_REF_NAME}-arm64-v8a.apk" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  publish:
    name: Publish GitHub Release
    needs:
      - prepare-release
      - publish-android
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install reference-root verifier dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'cryptography==50.0.0'

      - name: Download validated Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern '*.apk' \
            --dir dist
          shopt -s nullglob
          apks=(dist/*.apk)
          if (( ${#apks[@]} != 1 )); then
            printf 'expected 1 release APK, found %s\n' "${#apks[@]}" >&2
            exit 1
          fi

      - name: Create checksums
        run: |
          cd dist
          cp ../android/app/src/main/assets/THIRD_PARTY_NOTICES.txt THIRD_PARTY_NOTICES.txt
          sha256sum ./*.apk THIRD_PARTY_NOTICES.txt > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.sh "${GITHUB_REF_NAME}" dist
